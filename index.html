<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월향재</title>
    <style>
        /* 화면 전체 스크롤바를 숨겨서 깔끔하게 만듭니다 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000000; /* 사진이 로딩되기 전 기본 배경색 */
        }

        body {
            /* 업로드하신 파일명 'background.jpg'를 정확히 매칭했습니다 */
            background-image: url('background.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            
            display: flex;
            justify-content: center;
            align-items: flex-end; 
            padding-bottom: 80px;  
            box-sizing: border-box;

            /* 배경사진이 아래에서 위로 올라가는 애니메이션 (7초 동안 부드럽게 작동) */
            animation: moveBackgroundUp 7s ease-out forwards;
        }

        /* 배경 사진을 아래(bottom)에서 위(top)로 천천히 움직이게 하는 코드 */
        @keyframes moveBackgroundUp {
            0% {
                background-position: center bottom;
            }
            100% {
                background-position: center top;
            }
        }

        /* 서서히 글자가 나타나는 효과를 위한 타이틀 박스 설정 */
        .title-box {
            background-color: rgba(255, 255, 255, 0.15); 
            backdrop-filter: blur(5px);                  
            -webkit-backdrop-filter: blur(5px);
            color: #ffffff;
            padding: 20px 40px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);   
            
            /* 글자도 사진과 함께 서서히 나타나도록 애니메이션 추가 */
            animation: fadeInText 4s ease-in forwards;
            opacity: 0;
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 4px; 
            font-family: 'Gungsuh', 'GungsuhChe', '궁서', 'Batang', serif;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.9); 
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 화면 하단에 표시될 궁서체 문구 박스 -->
    <div class="title-box">
        <h1>언제나 담담하게 늘 그래왔듯</h1>
    </div>

</body>
</html>
