<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월향재</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000000;
        }

        /* -------------------------------------------------- */
        /* 1. PC 화면 기준 기본 설정 (기존 마우스 반응형 유지) */
        /* -------------------------------------------------- */
        .bg-container {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center top; /* PC에서는 간판 위주로 정렬 */
            background-repeat: no-repeat;
            transition: transform 0.2s ease-out; 
            z-index: 1;
        }

        /* 글자 레이아웃 설정 (우상단 정렬) */
        .content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: flex-end; 
            align-items: flex-start;   
            padding-top: 50px;
            padding-right: 50px;
            box-sizing: border-box;
            z-index: 2;
        }

        .title-box {
            background-color: transparent; 
            border: none;                  
            box-shadow: none;              
            text-align: right;
            animation: fadeInText 4s ease-in-out forwards;
            opacity: 0;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem; 
            letter-spacing: 2px; 
            font-family: 'Gungsuh', 'GungsuhChe', '궁서', 'Batang', serif;
            color: #ffffff;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9); 
        }

        /* -------------------------------------------------- */
        /* 2. 스마트폰(모바일) 화면 전용 설정 (화면 가로 768px 이하) */
        /* -------------------------------------------------- */
        @media (max-width: 768px) {
            .bg-container {
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                /* 사진 비율을 모바일 화면 가로에 꽉 맞추어 잘림을 최소화합니다 */
                background-size: contain; 
                /* 카페 전경과 매장 내부가 다 보이도록 사진 하단을 중심으로 배치 */
                background-position: center bottom; 
                background-color: #000000;
                transition: none; /* 모바일에서 어지러움을 유발하는 움직임 제거 */
            }

            .content-layer {
                /* 모바일에서는 글자를 화면 아래쪽 중앙에 배치해 안정감을 줍니다 */
                justify-content: center;
                align-items: flex-end;
                padding-top: 0;
                padding-right: 0;
                padding-bottom: 60px; /* 바닥에서 약간 띄움 */
            }

            .title-box {
                text-align: center;
            }

            h1 {
                /* 작은 화면에 맞춰 글씨 크기를 아담하게 조정 */
                font-size: 1.1rem; 
                letter-spacing: 1px;
            }
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translateY(-5px); }
            100% { opacity: 0.85; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 배경 사진 레이어 -->
    <div class="bg-container" id="background"></div>

    <!-- 글자 레이어 -->
    <div class="content-layer">
        <div class="title-box">
            <h1>언제나 담담하게 늘 그래왔듯</h1>
        </div>
    </div>

    <script>
        const bg = document.getElementById('background');
        const sensitivity = 25; 

        // PC 마우스 움직임 이벤트 (모바일이 아닐 때만 작동하도록 가로폭 체크)
        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const x = (e.clientX / window.innerWidth) - 0.5;
                const y = (e.clientY / window.innerHeight) - 0.5;
                bg.style.transform = `translate(${x * -sensitivity}px, ${y * -sensitivity}px)`;
            }
        });

        // 스마트폰 자이로 센서 이벤트
        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (window.innerWidth > 768) { // 필요 시 PC/태블릿 환경 전용 유지
                    let x = e.gamma; 
                    let y = e.beta;  
                    if (x > 30) x = 30; if (x < -30) x = -30;
                    if (y > 30) y = 30; if (y < -30) y = -30;
                    const moveX = (x / 30) * (sensitivity / 2);
                    const moveY = (y / 30) * (sensitivity / 2);
                    bg.style.transform = `translate(${-moveX}px, ${-moveY}px)`;
                }
            });
        }
    </script>
</body>
</html>
