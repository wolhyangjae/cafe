<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월향재</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000000;
        }

        body {
            background-image: url('background.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            
            display: flex;
            justify-content: flex-end; /* 가로 기준: 오른쪽 정렬 */
            align-items: flex-start;   /* ★ 세로 기준: 위쪽 정렬로 변경 (flex-end에서 변경) */
            
            /* ★ 위쪽과 오른쪽에서 떨어질 여백 공간 (상단 50px, 우측 50px) */
            padding-top: 50px;
            padding-right: 50px;
            box-sizing: border-box;

            animation: moveBackgroundDown 40s linear forwards;
        }

        @keyframes moveBackgroundDown {
            0% { background-position: center 0%; }
            100% { background-position: center 100%; }
        }

        .title-box {
            background-color: transparent; 
            border: none;                  
            box-shadow: none;              
            text-align: right;
            
            animation: fadeInText 6s ease-in-out forwards;
            opacity: 0;
        }

        h1 {
            margin: 0;
            font-size: 1.3rem; 
            letter-spacing: 2px; 
            font-family: 'Gungsuh', 'GungsuhChe', '궁서', 'Batang', serif;
            color: #ffffff;
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9); 
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translateY(-5px); } /* 위에서 아래로 살짝 내려오며 등장 */
            100% { opacity: 0.85; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 화면 오른쪽 위에 표시될 투명한 궁서체 문구 -->
    <div class="title-box">
        <h1>언제나 담담하게 늘 그래왔듯</h1>
    </div>

</body>
</html>
