<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월향재</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000000;
        }

        /* -------------------------------------------------- */
        /* 1. PC 화면 기준 설정 */
        /* -------------------------------------------------- */
        .bg-container {
            position: absolute;
            top: -5%;
            left: -5%;
            width: 110%;
            height: 110%;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center top; 
            background-repeat: no-repeat;
            transition: transform 0.2s ease-out; 
            z-index: 1;
        }

        /* 글자 레이아웃 설정 (PC에서는 우상단 정렬) */
        .content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: flex-end; 
            align-items: flex-start;   
            padding-top: 50px;
            padding-right: 50px;
            box-sizing: border-box;
            z-index: 2;
        }

        .title-box {
            background-color: transparent; 
            border: none;                  
            box-shadow: none;              
            text-align: right;
            animation: fadeInText 4s ease-in-out forwards;
            opacity: 0;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem; 
            letter-spacing: 2px; 
            font-family: 'Gungsuh', 'GungsuhChe', '궁서', 'Batang', serif;
            color: #ffffff;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9); 
        }

        /* -------------------------------------------------- */
        /* 2. 스마트폰(모바일) 화면 전용 설정 (화면 가로 768px 이하) */
        /* -------------------------------------------------- */
        @media (max-width: 768px) {
            .bg-container {
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background-size: contain; 
                /* 모바일에서 전경이 잘 보이도록 중심 설정 */
                background-position: center bottom; 
                background-color: #000000;
                transition: none; 
            }

            .content-layer {
                /* ★ 모바일에서 글자를 화면 맨 위(상단) 중앙으로 배치 */
                justify-content: center;
                align-items: flex-start;
                padding-top: 40px; /* 상단 여백 추가 */
                padding-right: 0;
                padding-bottom: 0; 
            }

            .title-box {
                text-align: center;
                width: 90%; /* 줄바꿈이 자연스럽도록 너비 지정 */
            }

            h1 {
                /* 새로운 문구에 맞춰 모바일 글씨 크기 최적화 */
                font-size: 1.15rem; 
                letter-spacing: 1px;
                line-height: 1.6; /* 두 줄로 나뉠 때를 위한 줄간격 */
            }
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translateY(-5px); }
            100% { opacity: 0.85; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 배경 사진 레이어 -->
    <div class="bg-container" id="background"></div>

    <!-- 글자 레이어 -->
    <div class="content-layer">
        <div class="title-box">
            <!-- ★ 요청하신 새로운 안내 멘트로 교체했습니다 -->
            <h1>월향재 웹 공간을 마련중입니다. 곧 만나요~</h1>
        </div>
    </div>

    <script>
        const bg = document.getElementById('background');
        const sensitivity = 25; 

        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const x = (e.clientX / window.innerWidth) - 0.5;
                const y = (e.clientY / window.innerHeight) - 0.5;
                bg.style.transform = `translate(${x * -sensitivity}px, ${y * -sensitivity}px)`;
            }
        });

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (window.innerWidth > 768) {
                    let x = e.gamma; 
                    let y = e.beta;  
                    if (x > 30) x = 30; if (x < -30) x = -30;
                    if (y > 30) y = 30; if (y < -30) y = -30;
                    const moveX = (x / 30) * (sensitivity / 2);
                    const moveY = (y / 30) * (sensitivity / 2);
                    bg.style.transform = `translate(${-moveX}px, ${-moveY}px)`;
                }
            });
        }
    </script>
</body>
</html>
