<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월향재</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000000;
        }

        /* -------------------------------------------------- */
        /* 1. PC 화면 기준 설정 */
        /* -------------------------------------------------- */
        .bg-container {
            position: absolute;
            width: 110%;
            height: 110%;
            left: -5%;
            background-image: url('background.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            transition: transform 0.2s ease-out; 
            z-index: 1;
            animation: pcBackgroundScrollUp 6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        @keyframes pcBackgroundScrollUp {
            0% {
                top: -5%; 
                background-position: center bottom; 
            }
            100% {
                top: -5%;
                background-position: center 65%;   
            }
        }

        /* ★ 글자 레이아웃을 '가운데 정렬(center)'로 변경 */
        .content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center; /* ★ 가로 기준: 정중앙 정렬 */
            align-items: center;     /* ★ 세로 기준: 정중앙 정렬 */
            box-sizing: border-box;
            z-index: 2;
            padding: 20px;
        }

        /* 배경색 없이 투명하고 은은하게 등장하는 텍스트 박스 */
        .title-box {
            background-color: transparent; 
            border: none;                  
            box-shadow: none;              
            text-align: center;      /* ★ 텍스트 중앙 정렬 */
            animation: fadeInText 5s ease-in-out forwards;
            opacity: 0;
        }

        h1 {
            margin: 0;
            font-size: 1.4rem;       /* 시적인 감성을 담아 차분한 크기로 조정 */
            letter-spacing: 3px;     /* 글자 사이 여백을 주어 여운을 표현 */
            font-family: 'Gungsuh', 'GungsuhChe', '궁서', 'Batang', serif;
            color: #ffffff;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 1); /* 어두운 밤하늘에서 글씨가 더 돋보이도록 음영 강화 */
            line-height: 2.2;        /* ★ 가사 각 줄이 겹치지 않고 정갈하게 보이도록 줄간격 넓힘 */
        }

        /* -------------------------------------------------- */
        /* 2. 스마트폰(모바일) 화면 전용 설정 (화면 가로 768px 이하) */
        /* -------------------------------------------------- */
        @media (max-width: 768px) {
            .bg-container {
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: 100% !important;
                background-size: contain; 
                background-position: center bottom; 
                background-color: #000000;
                transition: none; 
                animation: none; 
            }

            .content-layer {
                /* 모바일에서도 중앙 정렬을 유지하되, 하단 간판을 가리지 않도록 상단으로 살짝 올림 */
                justify-content: center;
                align-items: flex-start;
                padding-top: 50px;
            }

            h1 {
                font-size: 1.05rem; 
                letter-spacing: 1px;
                line-height: 2.0; /* 모바일 전용 줄간격 */
            }
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: scale(0.98); } /* 잔잔하게 스르륵 커지며 등장 */
            100% { opacity: 0.9; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- 배경 사진 레이어 -->
    <div class="bg-container" id="background"></div>

    <!-- 글자 레이어 (화면 중앙 배치) -->
    <div class="content-layer">
        <div class="title-box">
            <!-- ★ 요청하신 소중한 가사 문구를 자연스러운 줄바꿈(<br>)으로 나누어 반영했습니다 -->
            <h1>
                그런 슬픈 표정하지 말아요<br>
                난 포기하지 않아요<br>
                그대도 우리들의 만남에 후횐 없겠죠<br>
                어렵거도 험한길을 걸어도<br>
                나는 그대를 사랑해요~
            </h1>
        </div>
    </div>

    <script>
        const bg = document.getElementById('background');
        const sensitivity = 25; 

        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const x = (e.clientX / window.innerWidth) - 0.5;
                const y = (e.clientY / window.innerHeight) - 0.5;
                bg.style.transform = `translate(${x * -sensitivity}px, ${y * -sensitivity}px)`;
            }
        });

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (window.innerWidth > 768) {
                    let x = e.gamma; 
                    let y = e.beta;  
                    if (x > 30) x = 30; if (x < -30) x = -30;
                    if (y > 30) y = 30; if (y < -30) y = -30;
                    const moveX = (x / 30) * (sensitivity / 2);
                    const moveY = (y / 30) * (sensitivity / 2);
                    bg.style.transform = `translate(${-moveX}px, ${-moveY}px)`;
                }
            });
        }
    </script>
</body>
</html>
