<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월향재</title>
    <style>
        /* 화면 전체 스크롤바를 숨겨서 깔끔하게 만듭니다 */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000000;
        }

        body {
            background-image: url('background.jpg');
            /* 사진이 위아래로 움직일 수 있도록 세로 크기를 화면의 130%로 여유 있게 키웁니다 */
            background-size: cover;
            background-repeat: no-repeat;
            
            /* 글자 박스를 오른쪽 아래(우하단)로 정렬하기 위한 설정 */
            display: flex;
            justify-content: flex-end; /* 가로 기준 오른쪽 정렬 */
            align-items: flex-end;     /* 세로 기준 아래쪽 정렬 */
            
            /* 오른쪽과 바닥에서 떨어질 여백 공간 (적절히 조절 가능) */
            padding-right: 50px;
            padding-bottom: 50px;  
            box-sizing: border-box;

            /* 배경사진이 아래에서 위로 올라가는 애니메이션 (8초 동안 더욱 천천히 작동) */
            animation: moveBackgroundUp 8s ease-out forwards;
        }

        /* 사진의 아랫부분(매장 내부)에서 시작해 위쪽(간판)까지 자연스럽게 수직 이동하는 프레임 */
        @keyframes moveBackgroundUp {
            0% {
                background-position: center 100%; /* 가장 아래쪽 사진 영역 */
            }
            100% {
                background-position: center 0%;   /* 가장 위쪽 사진 영역 */
            }
        }

        /* 배경색을 완전히 빼고 조그마하게 다듬은 타이틀 박스 */
        .title-box {
            background-color: transparent; /* 배경색 완전 제거 (투명) */
            border: none;                  /* 테두리 제거 */
            box-shadow: none;              /* 그림자 제거 */
            text-align: right;
            
            /* 글자가 사진 움직임에 맞춰 부드럽게 나타나는 효과 */
            animation: fadeInText 4s ease-in-out forwards;
            opacity: 0;
        }

        h1 {
            margin: 0;
            font-size: 1.3rem; /* 글자 크기를 기존보다 아담하고 조그마하게 축소 */
            letter-spacing: 2px; 
            font-family: 'Gungsuh', 'GungsuhChe', '궁서', 'Batang', serif;
            color: #ffffff;
            
            /* 배경색이 없는 대신, 어두운 사진 속에서 글자가 선명하게 보이도록 은은한 검은 음영 유지 */
            text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.9); 
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translateY(5px); }
            100% { opacity: 0.85; transform: translateY(0); } /* 너무 튀지 않게 약간 아련한 투명도 지정 */
        }
    </style>
</head>
<body>

    <!-- 화면 오른쪽 아래에 표시될 투명한 궁서체 문구 -->
    <div class="title-box">
        <h1>언제나 담담하게 늘 그래왔듯</h1>
    </div>

</body>
</html>
