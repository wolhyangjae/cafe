<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월향재</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000000;
        }

        /* -------------------------------------------------- */
        /* 1. PC 화면 기준 설정 */
        /* -------------------------------------------------- */
        .bg-container {
            position: absolute;
            width: 110%;
            height: 110%;
            left: -5%;
            background-image: url('background.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            transition: transform 0.2s ease-out; 
            z-index: 1;
            /* ★ PC 전용: 6초 동안 아래에서 위로 천천히 올라오는 애니메이션 적용 */
            animation: pcBackgroundScrollUp 6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* 사진의 아랫부분(매장 전경)이 자연스럽게 올라와 안착하도록 애니메이션 설정 */
        @keyframes pcBackgroundScrollUp {
            0% {
                top: -5%; 
                background-position: center bottom; /* 아랫부분 조명부터 시작 */
            }
            100% {
                top: -5%;
                background-position: center 65%;   /* 카페 전경이 가장 아름답게 보이는 지점 */
            }
        }

        /* 공통 텍스트 스타일 (궁서체 및 그림자 효과) */
        h1, h2 {
            margin: 0;
            font-family: 'Gungsuh', 'GungsuhChe', '궁서', 'Batang', serif;
            color: #ffffff;
            text-shadow: 2px 2px 5px rgba(0, 0, 0, 1); 
        }

        /* [레이어 A] 상단 양쪽 배치를 위한 레이어 */
        .top-content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: space-between; 
            align-items: flex-start;        
            padding: 50px;
            box-sizing: border-box;
            z-index: 3; 
        }

        /* [레이어 B] 화면 정중앙 가사 배치를 위한 레이어 */
        .center-content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center; 
            align-items: center;     
            box-sizing: border-box;
            z-index: 2;
            padding: 20px;
        }

        .title-box {
            background-color: transparent; 
            border: none;                  
            box-shadow: none;              
            animation: fadeInText 4s ease-in-out forwards;
            opacity: 0;
        }

        .left-box { text-align: left; }
        .right-box { text-align: right; }
        .center-box { text-align: center; animation-duration: 5s; }

        /* 상단 멘트 폰트 스타일 */
        .top-content-layer h2 {
            font-size: 1.3rem;
            letter-spacing: 2px;
            line-height: 1.6;
            font-weight: normal;
        }

        /* 중앙 가사 폰트 스타일 */
        .center-content-layer h1 {
            font-size: 1.4rem;       
            letter-spacing: 3px;     
            line-height: 2.2;        
        }

        /* -------------------------------------------------- */
        /* 2. 스마트폰(모바일) 화면 전용 설정 (화면 가로 768px 이하) */
        /* -------------------------------------------------- */
        @media (max-width: 768px) {
            .bg-container {
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: 100% !important;
                /* ★ 모바일 검은 여백을 없애고 화면을 사진으로 꽉 채웁니다 */
                background-size: cover; 
                /* ★ 하단 매장 조명과 전경이 스마트폰 중앙에 시원하게 정렬되도록 수정 */
                background-position: center 85%; 
                background-color: #000000;
                transition: none; 
                animation: none; /* 모바일은 자동 스크롤 제외 */
            }

            /* 모바일 상단 멘트 정렬 */
            .top-content-layer {
                flex-direction: column; 
                justify-content: flex-start;
                align-items: flex-start;
                padding-top: 35px;
                padding-left: 20px;
                padding-right: 20px;
            }

            .top-content-layer .title-box {
                width: 100%;
                text-align: left; 
            }

            .top-content-layer .right-box {
                margin-top: 10px; 
            }

            /* ★ 모바일에서도 가사가 정중앙 밤하늘 영역에 깔끔하게 보이도록 활성화 */
            .center-content-layer {
                display: flex; 
                align-items: center; 
                justify-content: center; 
                transform: translateY(-130px); /* 간판 조명과 겹치지 않게 위로 살짝 이동 */
            }

            .top-content-layer h2 {
                font-size: 1.05rem; 
                letter-spacing: 1px;
                line-height: 1.5;
            }

            .center-content-layer h1 {
                font-size: 1.05rem; 
                letter-spacing: 1px;
                line-height: 1.9;
                text-shadow: 2px 2px 4px rgba(0, 0, 0, 1), -1px -1px 4px rgba(0, 0, 0, 1);
            }
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translateY(-5px); }
            100% { opacity: 0.85; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 배경 사진 레이어 -->
    <div class="bg-container" id="background"></div>

    <!-- [레이어 A] 상단 양쪽 멘트 영역 -->
    <div class="top-content-layer">
        <!-- 왼쪽 상단 멘트 -->
        <div class="title-box left-box">
            <h2>언제나 담담하게 늘 그래왔듯</h2>
        </div>
        
        <!-- 오른쪽 상단 멘트 -->
        <div class="title-box right-box">
            <h2>월향재 웹 공간을 마련중입니다.<br>우리 곧 만나요~</h2>
        </div>
    </div>

    <!-- [레이어 B] 화면 정중앙 가사 영역 -->
    <div class="center-content-layer">
        <div class="title-box center-box">
            <h1>
                그런 슬픈 표정하지 말아요<br>
                난 포기하지 않아요.<br>
                그대도 우리들의 만남에 후횐 없겠죠
            </h1>
        </div>
    </div>

    <script>
        const bg = document.getElementById('background');
        const sensitivity = 25; 

        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const x = (e.clientX / window.innerWidth) - 0.5;
                const y = (e.clientY / window.innerHeight) - 0.5;
                bg.style.transform = `translate(${x * -sensitivity}px, ${y * -sensitivity}px)`;
            }
        });

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (window.innerWidth > 768) {
                    let x = e.gamma; 
                    let y = e.beta;  
                    if (x > 30) x = 30; if (x < -30) x = -30;
                    if (y > 30) y = 30; if (y < -30) y = -30;
                    const moveX = (x / 30) * (sensitivity / 2);
                    const moveY = (y / 30) * (sensitivity / 2);
                    bg.style.transform = `translate(${-moveX}px, ${-moveY}px)`;
                }
            });
        }
    </script>
</body>
</html>
