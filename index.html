<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월향재</title>
    <style>
        body {
            /* 1. 사진 파일명(bg.jpg)과 배경 화면 설정 */
            background-image: url('bg.jpg');
            background-size: cover;          /* 사진을 비율에 맞춰 꽉 채움 */
            background-position: center top; /* 사진의 위쪽(간판)부터 아랫부분까지 자연스럽게 정렬 */
            background-attachment: fixed;
            background-repeat: no-repeat;
            
            /* 2. 전체 레이아웃 설정 */
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end; /* 글자 박스를 화면 아래쪽으로 내려 사진이 더 잘 보이도록 배치 */
            padding-bottom: 80px;  /* 바닥과의 여유 공간 */
            box-sizing: border-box;
        }

        .title-box {
            /* 3. 글자 박스 디자인 (반투명 서리 낀 듯한 고급스러운 느낌) */
            background-color: rgba(255, 255, 255, 0.15); /* 아주 연한 흰색 반투명 */
            backdrop-filter: blur(5px);                  /* 뒤쪽 배경을 살짝 흐리게 처리 */
            -webkit-backdrop-filter: blur(5px);
            color: #ffffff;
            padding: 20px 40px;
            border-radius: 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);   /* 은은한 그림자 */
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 4px; /* 글자 간격 넓혀서 여유로운 느낌 부여 */
            
            /* 4. 글자체를 '궁서체'로 지정 */
            font-family: 'Gungsuh', 'GungsuhChe', '궁서', 'Batang', serif;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8); /* 글자가 선명하게 보이도록 그림자 추가 */
        }
    </style>
</head>
<body>

    <!-- 화면 하단에 표시될 궁서체 문구 박스 -->
    <div class="title-box">
        <h1>언제나 담담하게 늘 그래왔듯</h1>
    </div>

</body>
</html>
