<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>월향재</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden; 
            background-color: #000000;
        }

        /* -------------------------------------------------- */
        /* 1. PC 화면 기준 설정 */
        /* -------------------------------------------------- */
        .bg-container {
            position: absolute;
            width: 110%;
            height: 110%;
            left: -5%;
            background-image: url('background.jpg');
            background-size: cover;
            background-repeat: no-repeat;
            
            /* ★ 마우스 반응 효과를 위한 부드러운 전환 속성 */
            transition: transform 0.2s ease-out; 
            z-index: 1;

            /* ★ PC 전용: 6초 동안 아래에서 위로 천천히 올라오는 애니메이션 적용 */
            animation: pcBackgroundScrollUp 6s cubic-bezier(0.25, 1, 0.5, 1) forwards;
        }

        /* 사진의 아랫부분(매장 전경)이 자연스럽게 올라와 안착하도록 애니메이션 프레임 설정 */
        @keyframes pcBackgroundScrollUp {
            0% {
                top: -5%; 
                background-position: center bottom; /* 아랫부분 조명부터 시작 */
            }
            100% {
                top: -5%;
                background-position: center 65%;   /* 카페 전경과 매장 내부가 가장 조화롭게 보이는 황금 비율 지점 */
            }
        }

        .content-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between; 
            align-items: flex-start;        
            padding-top: 50px;
            padding-left: 50px;
            padding-right: 50px;
            box-sizing: border-box;
            z-index: 2;
        }

        .title-box {
            background-color: transparent; 
            border: none;                  
            box-shadow: none;              
            animation: fadeInText 4s ease-in-out forwards;
            opacity: 0;
        }

        .left-box { text-align: left; }
        .right-box { text-align: right; }

        h1 {
            margin: 0;
            font-size: 1.3rem; 
            letter-spacing: 2px; 
            font-family: 'Gungsuh', 'GungsuhChe', '궁서', 'Batang', serif;
            color: #ffffff;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.9); 
            line-height: 1.6;
        }

        /* -------------------------------------------------- */
        /* 2. 스마트폰(모바일) 화면 전용 설정 (화면 가로 768px 이하) */
        /* -------------------------------------------------- */
        @media (max-width: 768px) {
            .bg-container {
                top: 0 !important;
                left: 0 !important;
                width: 100% !important;
                height: 100% !important;
                background-size: contain; 
                background-position: center bottom; 
                background-color: #000000;
                transition: none; 
                /* 모바일에서는 시선 방해와 가려짐을 막기 위해 스크롤 애니메이션 제외 */
                animation: none; 
            }

            .content-layer {
                flex-direction: column; 
                justify-content: flex-start;
                align-items: flex-start;
                padding-top: 35px;
                padding-left: 20px;
                padding-right: 20px;
            }

            .title-box {
                width: 100%;
                text-align: left; 
            }

            .right-box {
                margin-top: 15px; 
            }

            h1 {
                font-size: 1.05rem; 
                letter-spacing: 1px;
                line-height: 1.5;
            }
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: translateY(-5px); }
            100% { opacity: 0.85; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <!-- 배경 사진 레이어 -->
    <div class="bg-container" id="background"></div>

    <!-- 글자 레이어 -->
    <div class="content-layer">
        <!-- 왼쪽 문구 박스 -->
        <div class="title-box left-box">
            <h1>언제나 담담하게 늘 그래왔듯</h1>
        </div>
        
        <!-- 오른쪽 문구 박스 -->
        <div class="title-box right-box">
            <h1>월향재 웹 공간을 마련중입니다.<br>우리 곧 만나요~</h1>
        </div>
    </div>

    <script>
        const bg = document.getElementById('background');
        const sensitivity = 25; 

        document.addEventListener('mousemove', (e) => {
            if (window.innerWidth > 768) {
                const x = (e.clientX / window.innerWidth) - 0.5;
                const y = (e.clientY / window.innerHeight) - 0.5;
                bg.style.transform = `translate(${x * -sensitivity}px, ${y * -sensitivity}px)`;
            }
        });

        if (window.DeviceOrientationEvent) {
            window.addEventListener('deviceorientation', (e) => {
                if (window.innerWidth > 768) {
                    let x = e.gamma; 
                    let y = e.beta;  
                    if (x > 30) x = 30; if (x < -30) x = -30;
                    if (y > 30) y = 30; if (y < -30) y = -30;
                    const moveX = (x / 30) * (sensitivity / 2);
                    const moveY = (y / 30) * (sensitivity / 2);
                    bg.style.transform = `translate(${-moveX}px, ${-moveY}px)`;
                }
            });
        }
    </script>
</body>
</html>
